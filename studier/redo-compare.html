<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redone timeline images — before / after</title>
<style>
  body { background:#fff; color:#17212e; font:16px/1.5 Georgia, serif; margin:0; padding:26px; }
  h1 { font-size:1.5rem; margin-bottom:4px; }
  .sub { color:#4a5763; margin-bottom:24px; }
  .card { border-top:2px solid #d3dde5; padding:18px 0; max-width:760px; }
  .card h3 { font-size:1rem; color:#9e1b16; margin-bottom:2px; }
  .card .pr { color:#4a5763; font-size:.92rem; font-style:italic; margin-bottom:12px; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .slot { text-align:center; }
  .slot .lab { font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:#6f8093; margin-bottom:6px; }
  /* checkerboard shows transparency; images fit whole, centered */
  .slot .frame {
    aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
    background:conic-gradient(#eef2f6 90deg,#fff 0 180deg,#eef2f6 0 270deg,#fff 0) 0 0/22px 22px;
    border:1px solid #d3dde5; border-radius:6px; padding:6px;
  }
  .slot img { max-width:100%; max-height:100%; object-fit:contain; display:block; }
  .empty { color:#9e1b16; padding:40px; }
</style></head>
<body>
  <h1>Redone timeline images</h1>
  <p class="sub">Left = the version that was replaced, right = the new one. Newest at the top.</p>
  <div id="list"><p class="empty">loading…</p></div>
<script>
fetch('_prev/manifest.json?' + Date.now())
  .then(r => r.ok ? r.json() : [])
  .then(list => {
    const el = document.getElementById('list');
    if (!list.length) { el.innerHTML = '<p class="empty">No redone images logged yet.</p>'; return; }
    el.innerHTML = list.slice().reverse().map(m => `
      <div class="card">
        <h3>${m.path}</h3>
        <div class="pr">${m.prompt || ''}</div>
        <div class="pair">
          <div class="slot"><div class="lab">before (replaced)</div><div class="frame"><img src="${m.prev}?${Date.now()}"></div></div>
          <div class="slot"><div class="lab">after (new)</div><div class="frame"><img src="${m.path}?${Date.now()}"></div></div>
        </div>
      </div>`).join('');
  })
  .catch(e => { document.getElementById('list').innerHTML = '<p class="empty">manifest not found yet — run a redo first.</p>'; });
</script>
</body></html>
